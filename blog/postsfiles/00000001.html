<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>起点 — Googology Pages</title>
<link rel="stylesheet" href="../../assets/win7.css">
<style>
  .post-win { width: 760px; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 9px;
    flex: 0 0 auto;
    padding: 7px 9px;
    background: linear-gradient(180deg, #fafdff 0%, #ecf5fc 100%);
    border-bottom: 1px solid #c8dcea;
  }

  .back-mark {
    width: 0;
    height: 0;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    border-right: 6px solid #2f6288;
  }

  .addressbar {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    gap: 3px;
    height: 23px;
    min-width: 0;
    padding: 0 9px;
    font-size: 11px;
    color: #2b5473;
    white-space: nowrap;
    overflow: hidden;
    background: #fff;
    border: 1px solid #93b1c8;
    border-radius: 3px;
    box-shadow: inset 0 1px 2px rgba(28, 62, 92, .14);
  }

  .addressbar .sep { color: #93aec1; }
  .addressbar .cur { color: #16496f; font-weight: 600; }

  .article {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 26px 36px 30px;
    background: #fff;
  }

  .article h1 {
    margin: 0 0 6px;
    font-size: 19px;
    font-weight: 600;
    color: #123f60;
  }

  .meta {
    margin: 0 0 16px;
    padding-bottom: 12px;
    font-size: 11px;
    color: #6c8aa0;
    border-bottom: 1px solid #e4eef6;
  }

  .article p {
    margin: 0 0 12px;
    font-size: 13px;
    line-height: 1.75;
    color: #25455b;
  }

  .article sup { font-size: 10px; }

  .article mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
  .article mjx-container[display="true"] { margin: 14px 0; }
</style>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'a']
  }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="desktop">
  <main class="win post-win">
    <div class="titlebar">
      <span class="app-ico" aria-hidden="true">G</span>
      <span class="title">博客 — 起点</span>
      <span class="caps" aria-hidden="true">
        <span class="cap min"></span>
        <span class="cap max"></span>
        <span class="cap close"></span>
      </span>
    </div>

    <div class="toolbar">
      <a class="btn" href="../index.html"><span class="back-mark" aria-hidden="true"></span>全部帖子</a>
      <div class="addressbar">
        <span>blog</span>
        <span class="sep">›</span>
        <span>postsfiles</span>
        <span class="sep">›</span>
        <span class="cur">00000001.html</span>
      </div>
    </div>

    <article class="article">
      <h1>起点</h1>
      <p class="meta">2026-11-14 · 编号 00000001</p>

      <p>Googology 研究大数的命名、比较与书写方式。</p>

      <p>常用基准出现得很快。googol 为 $10^{100}$，googolplex 为 10 的 googol 次方，即 $10^{10^{100}}$。Graham 数无法用常规指数表示，需以上箭头记法逐层定义，直至箭头的数量本身也须另行表示。</p>

      <p>本站记录介于上述基准之间的内容：命名体系、非直观的比较结果，以及围绕记法开展的实验。</p>
    </article>

    <div class="statusbar">
      <span>博客 — 起点</span>
      <span>00000001.html</span>
    </div>
  </main>
</body>
</html>
