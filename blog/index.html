<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博客 — Googology Pages</title>
<link rel="stylesheet" href="../assets/mfc.css">
</head>
<body class="desktop">
  <main class="win blog">
    <div class="titlebar">
      <span class="app-ico" aria-hidden="true">G</span>
      <span class="title">博客 — Googology Pages</span>
      <span class="caps" aria-hidden="true">
        <span class="cap min"></span>
        <span class="cap max"></span>
        <span class="cap close"></span>
      </span>
    </div>

    <div class="toolbar">
      <a class="btn" href="../index.html"><span class="back-mark" aria-hidden="true"></span>首页</a>
      <div class="addressbar">
        <span>googology</span>
        <span class="sep">›</span>
        <span>blog</span>
        <span class="sep">›</span>
        <span class="cur">posts</span>
      </div>
    </div>

    <div class="pane-head">
      <h2>帖子</h2>
      <span class="pane-count" id="count"></span>
    </div>

    <div class="posts" id="posts">
      <p class="empty">正在读取帖子清单…</p>
    </div>

    <div class="statusbar">
      <span id="status">正在读取帖子清单…</span>
      <span>blog/posts.json</span>
    </div>
  </main>

<script>
(function () {
  'use strict';

  var listEl = document.getElementById('posts');
  var statusEl = document.getElementById('status');
  var countEl = document.getElementById('count');

  var POST_FILE = /^(?:.*\/)?([0-9a-f]{8})\.html$/i;

  function pad(id) { return id.toLowerCase(); }

  function fetchManifest() {
    return fetch('./posts.json', { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('posts.json — HTTP ' + res.status);
      return res.json();
    }).then(function (data) {
      return Array.isArray(data) ? data
           : (data && Array.isArray(data.posts) ? data.posts : []);
    });
  }

  // Only works when the server prints a directory listing.
  // Apache, nginx (autoindex), python -m http.server all do.
  function fetchDirectory() {
    return fetch('./postsfiles/', { cache: 'no-store' }).then(function (res) {
      if (!res.ok) return [];
      return res.text().then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var ids = [];
        Array.prototype.forEach.call(doc.querySelectorAll('a[href]'), function (a) {
          var href = (a.getAttribute('href') || '').split(/[?#]/)[0];
          var hit = POST_FILE.exec(href);
          if (hit) ids.push(hit[1].toLowerCase());
        });
        return ids;
      });
    }).catch(function () { return []; });
  }

  function toPost(item) {
    var id = String(item.id || item.file || '').trim().toLowerCase().replace(/\.html$/, '');
    if (!/^[0-9a-f]{8}$/.test(id)) return null;
    return {
      id: id,
      href: './postsfiles/' + id + '.html',
      title: String(item.title || '').trim() || '未命名',
      date: String(item.date || '').trim(),
      summary: String(item.summary || '').trim(),
      tags: Array.isArray(item.tags) ? item.tags.filter(Boolean).map(String) : [],
      assets: Array.isArray(item.assets) ? item.assets.filter(function (a) {
        return a && typeof a.file === 'string';
      }).length : 0
    };
  }

  function sortPosts(a, b) {
    if (a.date && b.date && a.date !== b.date) return a.date < b.date ? 1 : -1;
    return parseInt(b.id, 16) - parseInt(a.id, 16);
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function render(posts) {
    listEl.textContent = '';

    if (!posts.length) {
      listEl.appendChild(el('p', 'empty', '暂无帖子。'));
      statusEl.textContent = '当前没有帖子。';
      countEl.textContent = '';
      return;
    }

    posts.forEach(function (post) {
      var row = el('a', 'post');
      row.href = post.href;

      row.appendChild(el('span', 'post-id', post.id));

      var main = el('span', 'post-main');
      main.appendChild(el('span', 'post-title', post.title));
      if (post.summary) main.appendChild(el('span', 'post-summary', post.summary));
      row.appendChild(main);

      var side = el('span', 'post-side');
      if (post.date) side.appendChild(el('span', 'post-date', post.date));
      if (post.assets) side.appendChild(el('span', 'post-assets', '附件 ' + post.assets));
      if (post.tags.length) {
        var tags = el('span', 'post-tags');
        post.tags.forEach(function (tag) { tags.appendChild(el('span', 'tag', tag)); });
        side.appendChild(tags);
      }
      row.appendChild(side);

      listEl.appendChild(row);
    });

    countEl.textContent = '共 ' + posts.length + ' 篇';
    statusEl.textContent = '共 ' + posts.length + ' 篇 · postsfiles/';
  }

  function fail(message) {
    listEl.textContent = '';
    listEl.appendChild(el('p', 'empty error', message));
    statusEl.textContent = '帖子清单读取失败。';
    countEl.textContent = '';
  }

  if (location.protocol === 'file:') {
    fail('本页通过 HTTP 读取 posts.json 与 postsfiles/ 目录，以本地文件方式打开无法加载。请经 HTTP 服务访问（例如 python -m http.server）。');
    return;
  }

  Promise.all([fetchManifest(), fetchDirectory()]).then(function (results) {
    var map = new Map();

    results[0].forEach(function (item) {
      var post = toPost(item);
      if (post) map.set(post.id, post);
    });

    results[1].forEach(function (id) {
      if (!map.has(id)) {
        map.set(id, {
          id: id,
          href: './postsfiles/' + id + '.html',
          title: '未命名',
          date: '',
          summary: '',
          tags: []
        });
      }
    });

    render(Array.from(map.values()).sort(sortPosts));
  }).catch(function (err) {
    fail('读取帖子清单失败（' + err.message + '）。');
  });
}());</script>
</body>
</html>
