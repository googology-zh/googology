<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" role="img" aria-label="二分查找的区间收缩示意">
  <rect width="640" height="210" fill="#ffffff"/>
  <text x="16" y="24" font-family="Tahoma, SimSun, sans-serif" font-size="12" font-weight="bold" fill="#1b1b1b">在升序数组中查找 x = 23，区间 [lo, hi) 逐步收缩</text>

  <g font-family="Consolas, monospace" font-size="11" fill="#1b1b1b">
    <!-- 数组单元 -->
    <g>
      <rect x="30" y="44" width="60" height="30" fill="#efede7" stroke="#6e6a62" stroke-width="1"/>
      <rect x="90" y="44" width="60" height="30" fill="#efede7" stroke="#6e6a62" stroke-width="1"/>
      <rect x="150" y="44" width="60" height="30" fill="#efede7" stroke="#6e6a62" stroke-width="1"/>
      <rect x="210" y="44" width="60" height="30" fill="#efede7" stroke="#6e6a62" stroke-width="1"/>
      <rect x="270" y="44" width="60" height="30" fill="#fbf0c8" stroke="#6e6a62" stroke-width="1"/>
      <rect x="330" y="44" width="60" height="30" fill="#efede7" stroke="#6e6a62" stroke-width="1"/>
      <rect x="390" y="44" width="60" height="30" fill="#efede7" stroke="#6e6a62" stroke-width="1"/>
      <rect x="450" y="44" width="60" height="30" fill="#efede7" stroke="#6e6a62" stroke-width="1"/>
      <rect x="510" y="44" width="60" height="30" fill="#efede7" stroke="#6e6a62" stroke-width="1"/>
    </g>

    <g text-anchor="middle">
      <text x="60" y="64">2</text>
      <text x="120" y="64">5</text>
      <text x="180" y="64">8</text>
      <text x="240" y="64">12</text>
      <text x="300" y="64">16</text>
      <text x="360" y="64">23</text>
      <text x="420" y="64">38</text>
      <text x="480" y="64">56</text>
      <text x="540" y="64">72</text>
    </g>

    <!-- 下标 -->
    <g text-anchor="middle" fill="#6d6a63">
      <text x="60" y="88">0</text>
      <text x="120" y="88">1</text>
      <text x="180" y="88">2</text>
      <text x="240" y="88">3</text>
      <text x="300" y="88">4</text>
      <text x="360" y="88">5</text>
      <text x="420" y="88">6</text>
      <text x="480" y="88">7</text>
      <text x="540" y="88">8</text>
    </g>
  </g>

  <!-- lo / hi / mid 标注 -->
  <g font-family="Consolas, monospace" font-size="10" fill="#33322e">
    <text x="26" y="40">lo</text>
    <text x="566" y="40">hi</text>
    <text x="286" y="40" fill="#7a5c14">mid</text>

    <path d="M30 38 V30 H296" stroke="#6e6a62" stroke-width="1" fill="none"/>
    <path d="M570 38 V30 H304" stroke="#6e6a62" stroke-width="1" fill="none"/>
    <path d="M290 38 V34" stroke="#7a5c14" stroke-width="1" fill="none"/>
  </g>

  <!-- 说明 -->
  <g font-family="SimSun, serif" font-size="11" fill="#33322e">
    <text x="16" y="118">第 1 轮：mid = (0 + 9) / 2 = 4，a[4] = 16 &lt; 23，区间右移为 [5, 9)。</text>
    <text x="16" y="136">第 2 轮：mid = (5 + 9) / 2 = 7，a[7] = 56 &gt; 23，区间左移为 [5, 7)。</text>
    <text x="16" y="154">第 3 轮：mid = (5 + 7) / 2 = 6，a[6] = 38 &gt; 23，区间为 [5, 6)。</text>
    <text x="16" y="172">第 4 轮：mid = 5，a[5] = 23，命中，返回 5。</text>
    <text x="16" y="192" fill="#6d6a63">每轮区间长度至少减半，比较次数的上界是 ceil(log2 n) + 1。</text>
  </g>
</svg>
