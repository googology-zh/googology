<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="莫队左右指针在相邻块间的移动">
  <rect width="640" height="200" fill="#ffffff"/>
  <text x="16" y="24" font-family="Tahoma, SimSun, sans-serif" font-size="12" font-weight="bold" fill="#1b1b1b">奇偶排序：块 0 右指针升序，块 1 右指针降序，交界处不回扫</text>

  <!-- 序列 -->
  <g font-family="Consolas, monospace" font-size="10">
    <rect x="30" y="46" width="560" height="22" fill="#efede7" stroke="#6e6a62" stroke-width="1"/>
    <g text-anchor="middle" fill="#33322e">
      <text x="58" y="61">0</text><text x="86" y="61">1</text><text x="114" y="61">2</text>
      <text x="142" y="61">3</text><text x="170" y="61">4</text><text x="198" y="61">5</text>
      <text x="226" y="61">6</text><text x="254" y="61">7</text><text x="282" y="61">8</text>
      <text x="310" y="61">9</text><text x="338" y="61">10</text><text x="366" y="61">11</text>
      <text x="394" y="61">12</text><text x="422" y="61">13</text><text x="450" y="61">14</text>
      <text x="478" y="61">15</text><text x="506" y="61">16</text><text x="534" y="61">17</text>
      <text x="562" y="61">18</text>
    </g>
  </g>

  <!-- 块分隔 -->
  <g stroke="#8f8a81" stroke-width="1" fill="none">
    <path d="M30 46 V76 M310 46 V76 M590 46 V76"/>
    <path d="M310 84 V96"/>
  </g>
  <g font-family="Consolas, monospace" font-size="10" fill="#6d6a63">
    <text x="32" y="92">块 0</text>
    <text x="314" y="92">块 1</text>
    <text x="556" y="92">块 2</text>
  </g>

  <!-- 移动轨迹 -->
  <g stroke="#2f4a63" stroke-width="1" fill="none">
    <path d="M58 124 H300" stroke-dasharray="4 3"/>
    <path d="M300 124 V140 H560" stroke-dasharray="4 3"/>
    <path d="M560 140 V124" stroke="#a1483c" stroke-dasharray="4 3"/>
  </g>

  <g font-family="SimSun, serif" font-size="11" fill="#33322e">
    <text x="16" y="120">右指针在块 0 内从最小扫到最大</text>
    <text x="16" y="158" fill="#a1483c">翻转后块 1 从最大回到最小，落点正好接上下一块</text>
    <text x="16" y="182" fill="#6d6a63">左指针只在单个块内摆动，单次幅度不超过块长 B；块长取 n / sqrt(q)。</text>
  </g>
</svg>
