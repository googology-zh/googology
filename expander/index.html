<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>展开器 — Googology Pages</title>
<link rel="stylesheet" href="../assets/win7.css">
<style>
  .links-win { width: 660px; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 9px;
    flex: 0 0 auto;
    padding: 7px 9px;
    background: linear-gradient(180deg, #fafdff 0%, #ecf5fc 100%);
    border-bottom: 1px solid #c8dcea;
  }

  .back-mark {
    width: 0;
    height: 0;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    border-right: 6px solid #2f6288;
  }

  .addressbar {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    gap: 3px;
    height: 23px;
    min-width: 0;
    padding: 0 9px;
    font-size: 11px;
    color: #2b5473;
    white-space: nowrap;
    overflow: hidden;
    background: #fff;
    border: 1px solid #93b1c8;
    border-radius: 3px;
    box-shadow: inset 0 1px 2px rgba(28, 62, 92, .14);
  }

  .addressbar .sep { color: #93aec1; }
  .addressbar .cur { color: #16496f; font-weight: 600; }

  .pane {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 16px 16px;
    background: #fff;
  }

  .pane-note {
    margin: 0 0 10px;
    font-size: 11px;
    color: #6c8aa0;
  }

  .link-list { margin: 0; padding: 0; list-style: none; }

  .link-list li + li { border-top: 1px solid #e8f0f6; }

  .link-row {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 8px 10px;
    text-decoration: none;
    color: inherit;
    border-radius: 3px;
  }

  .link-row:hover { background: linear-gradient(180deg, #f7fcff 0%, #e3f1fd 100%); }
  .link-row:focus-visible { outline: 2px solid #8dc4e9; outline-offset: -2px; }

  .link-ico {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
  }

  .link-main {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .link-name { font-size: 12px; font-weight: 600; color: #1a4767; }

  .link-desc {
    margin-top: 1px;
    font-size: 11px;
    color: #6f889d;
  }

  .link-url {
    margin-top: 2px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 10px;
    letter-spacing: .3px;
    color: #7d95a8;
  }

  .link-go {
    margin-left: auto;
    padding-left: 12px;
    font-size: 13px;
    color: #5f88a4;
  }
</style>
</head>
<body class="desktop">
  <main class="win links-win">
    <div class="titlebar">
      <span class="app-ico" aria-hidden="true">G</span>
      <span class="title">展开器 — Googology Pages</span>
      <span class="caps" aria-hidden="true">
        <span class="cap min"></span>
        <span class="cap max"></span>
        <span class="cap close"></span>
      </span>
    </div>

    <div class="toolbar">
      <a class="btn" href="../index.html"><span class="back-mark" aria-hidden="true"></span>首页</a>
      <div class="addressbar">
        <span>googology</span>
        <span class="sep">›</span>
        <span class="cur">expander</span>
      </div>
    </div>

    <div class="pane">
      <p class="pane-note">下列记法展开器由第三方维护，部署于 GitHub Pages，点击后在新窗口打开。</p>

      <ul class="link-list">
        <li>
          <a class="link-row" href="https://smilelee-lyx.github.io/ne-rewritten/" target="_blank" rel="noopener noreferrer">
            <svg class="link-ico" viewBox="0 0 24 24" aria-hidden="true">
              <defs>
                <linearGradient id="lk-page" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#ffffff"/>
                  <stop offset="1" stop-color="#d5e8f6"/>
                </linearGradient>
              </defs>
              <rect x="3.5" y="4.5" width="12" height="15" rx="1" fill="url(#lk-page)" stroke="#6f9dbb" stroke-width="1"/>
              <g stroke="#3d7ea6" stroke-width="1.5" fill="none">
                <path d="M11.5 11.5L18 5"/>
                <path d="M14.4 5h3.6v3.6"/>
              </g>
            </svg>
            <span class="link-main">
              <span class="link-name">Notation Explorer rewritten</span>
              <span class="link-desc">BMS 及相关记法的重写版展开器。</span>
              <span class="link-url">smilelee-lyx.github.io/ne-rewritten</span>
            </span>
            <span class="link-go" aria-hidden="true">↗</span>
          </a>
        </li>

        <li>
          <a class="link-row" href="https://hypcos.github.io/notation-explorer/" target="_blank" rel="noopener noreferrer">
            <svg class="link-ico" viewBox="0 0 24 24" aria-hidden="true">
              <defs>
                <linearGradient id="lk-page-2" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#ffffff"/>
                  <stop offset="1" stop-color="#d5e8f6"/>
                </linearGradient>
              </defs>
              <rect x="3.5" y="4.5" width="12" height="15" rx="1" fill="url(#lk-page-2)" stroke="#6f9dbb" stroke-width="1"/>
              <g stroke="#3d7ea6" stroke-width="1.5" fill="none">
                <path d="M11.5 11.5L18 5"/>
                <path d="M14.4 5h3.6v3.6"/>
              </g>
            </svg>
            <span class="link-main">
              <span class="link-name">Notation Explorer</span>
              <span class="link-desc">原版记法展开器，提供展开层级与基本列。</span>
              <span class="link-url">hypcos.github.io/notation-explorer</span>
            </span>
            <span class="link-go" aria-hidden="true">↗</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="statusbar">
      <span>展开器</span>
      <span>收录 2 项</span>
    </div>
  </main>
</body>
</html>
